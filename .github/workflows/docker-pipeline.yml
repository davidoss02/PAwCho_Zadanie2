name: Z2 Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_URL: ghcr.io
  IMAGE: ${{ github.repository }}
  DOCKER_CACHE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/projekt-cache:z2

jobs:
  konteneryzacja:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Pobranie zrodel
        uses: actions/checkout@v4

      - name: Inicjalizacja QEMU & Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Autoryzacja w rejestrach
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generowanie tagow (Metadata)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_URL }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v1.0.0
            type=sha

      - name: Budowa lokalna do audytu
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: temp-image:local
          cache-from: type=registry,ref=${{ env.DOCKER_CACHE_REF }}

      - name: Audyt bezpieczenstwa (Docker Scout)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: temp-image:local
          only-severities: critical,high
          exit-code: true

      - name: Finalowa budowa (Multi-arch) i wysylka
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_CACHE_REF }}
          cache-to: type=registry,ref=${{ env.DOCKER_CACHE_REF }},mode=max